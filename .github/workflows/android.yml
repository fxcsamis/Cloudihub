name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Decode Debug Keystore
      run: base64 -d debug.keystore.base64 > debug.keystore

    - name: Build with Gradle
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cloudihub-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

  benchmark:
    # Runs the on-device performance tests (macrobenchmark module) on a real
    # physical device via Firebase Test Lab. The previous local GitHub
    # Actions emulator (reactivecircus/android-emulator-runner) uses
    # software rendering (swiftshader) with no real GPU, so it cannot
    # produce real FrameTimingMetric data (frame duration / jank) - only a
    # bare frameCount. A physical device is required for real numbers.
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Decode Debug Keystore
      run: base64 -d debug.keystore.base64 > debug.keystore

    - name: Build app + benchmark test APKs
      run: gradle :app:assembleDebug :macrobenchmark:assembleBenchmark --no-daemon

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: cloudehubtest

    - name: Run Macrobenchmark on Firebase Test Lab (real device)
      run: |
        set -o pipefail
        gcloud firebase test android run \
          --type instrumentation \
          --app app/build/outputs/apk/debug/app-debug.apk \
          --test macrobenchmark/build/outputs/apk/benchmark/macrobenchmark-benchmark.apk \
          --device model=redfin,version=30,locale=en,orientation=portrait \
          --timeout 15m \
          --directories-to-pull=/sdcard/Download \
          --environment-variables="^;^androidx.benchmark.suppressErrors=EMULATOR,DEBUGGABLE" \
          2>&1 | tee ftl-output.log

    - name: Download benchmark results from Firebase Test Lab
      # Test results (benchmarkData.json, perfetto traces, etc.) land in a
      # Google-managed GCS bucket, not in the local build output folder -
      # that's why the previous artifact only contained the APK. Parse the
      # bucket URL gcloud printed and pull the real results down.
      if: always()
      run: |
        RAW=$(grep -oE 'storage/browser/[^]]+' ftl-output.log | head -1)
        BUCKET_PATH="gs://${RAW#storage/browser/}"
        echo "Pulling results from: $BUCKET_PATH"
        mkdir -p macrobenchmark-firebase-results
        gsutil -m cp -r "${BUCKET_PATH}*" macrobenchmark-firebase-results/ || true

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: macrobenchmark-results
        path: macrobenchmark-firebase-results/**/*
        if-no-files-found: warn
