name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Decode Debug Keystore
      run: base64 -d debug.keystore.base64 > debug.keystore

    - name: Build with Gradle
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cloudihub-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

  benchmark:
    # Runs the on-device performance tests (macrobenchmark module) so scroll
    # jank / startup time regressions show up as numbers in every CI run
    # instead of only being caught by manually screen-recording the app.
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Decode Debug Keystore
      run: base64 -d debug.keystore.base64 > debug.keystore

    - name: Enable KVM (hardware acceleration for the emulator)
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run Macrobenchmark on a virtual device
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        target: google_apis
        arch: x86_64
        profile: pixel_6
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: gradle :macrobenchmark:connectedCheck --no-daemon --no-configuration-cache

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: macrobenchmark-results
        path: macrobenchmark/build/outputs/**/*
        if-no-files-found: warn
